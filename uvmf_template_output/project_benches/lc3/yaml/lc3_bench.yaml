uvmf:
  benches:
    lc3:
      active_passive:
      - bfm_name: fetch_env_agent_in
        value: PASSIVE
      - bfm_name: fetch_env_agent_out
        value: PASSIVE
      - bfm_name: decode_env_agent_in
        value: PASSIVE
      - bfm_name: decode_env_agent_out
        value: PASSIVE
      - bfm_name: execute_env_agent_in
        value: PASSIVE
      - bfm_name: execute_env_agent_out
        value: PASSIVE
      - bfm_name: mem_access_env_agent_in
        value: PASSIVE
      - bfm_name: mem_access_env_agent_out
        value: PASSIVE
      - bfm_name: control_env_agent_in
        value: PASSIVE
      - bfm_name: control_env_agent_out
        value: PASSIVE
      - bfm_name: writeback_env_agent_in
        value: PASSIVE
      - bfm_name: writeback_env_agent_out
        value: PASSIVE
      - bfm_name: imem_agent
        value: ACTIVE
      - bfm_name: data_mem_agent
        value: ACTIVE
      active_passive_default: ACTIVE
      clock_half_period: 5ns
      clock_phase_offset: 9ns
      existing_library_component: 'True'
      interface_params: []
      reset_assertion_level: 'False'
      reset_duration: 200ns
      top_env: lc3
      use_dpi_link: 'False'
