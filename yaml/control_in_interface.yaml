uvmf:
  interfaces:
    control_in:
      clock: clk
      ports:
      - dir: output
        name: complete_data
        reset_value: '''b0'
        width: '1'
      - dir: output
        name: complete_instr
        reset_value: '''b0'
        width: '1'
      - dir: output
        name: IR
        reset_value: '''b0'
        width: '16'
      - dir: output
        name: NZP
        reset_value: '''b0'
        width: '3'
      - dir: output
        name: psr
        reset_value: '''b0'
        width: '3'
      - dir: output
        name: IR_Exec
        reset_value: '''b0'
        width: '16'
      - dir: output
        name: IMem_dout
        reset_value: '''b0'
        width: '16'
      reset: rst
      reset_assertion_level: 'True'
      transaction_vars:
      - iscompare: 'False'
        isrand: 'False'
        name: complete_data
        type: bit
      - iscompare: 'False'
        isrand: 'False'
        name: complete_instr
        type: bit
      - iscompare: 'False'
        isrand: 'False'
        name: IR
        type: bit [15:0]
      - iscompare: 'False'
        isrand: 'False'
        name: NZP
        type: bit [2:0]
      - iscompare: 'False'
        isrand: 'False'
        name: psr
        type: bit [2:0]
      - iscompare: 'False'
        isrand: 'False'
        name: IR_Exec
        type: bit [15:0]
      - iscompare: 'False'
        isrand: 'False'
        name: IMem_dout
        type: bit [15:0]