uvmf:
  interfaces:
    mem_access_out:
      clock: clk
      reset: rst
      reset_assertion_level: 'True'
      ports:
      - name: dmem_addr
        dir: input
        width: '16'
        reset_value: '''b0'
      - name: dmem_din
        dir: input
        width: '16'
        reset_value: '''b0'
      - name: dmem_rd
        dir: input
        width: '1'
        reset_value: '''b0'
      - name: memout
        dir: input
        width: '16'
        reset_value: '''b0'
      transaction_vars:
      - name: dmem_addr
        type: bit [15:0]
        iscompare: 'True'
        isrand: 'False'
        comment: ''
      - name: dmem_din
        type: bit [15:0]
        iscompare: 'True'
        isrand: 'False'
        comment: ''
      - name: dmem_rd
        type: bit
        iscompare: 'True'
        isrand: 'False'
        comment: ''
      - name: memout
        type: bit [15:0]
        iscompare: 'True'
        isrand: 'False'
        comment: ''



