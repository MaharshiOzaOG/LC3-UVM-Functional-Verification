      - dir: input
        name: Mem_Control_out
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: aluout
        reset_value: '''b0'
        width: '16'
      - dir: input
        name: pcout
        reset_value: '''b0'
        width: '16'
      - dir: input
        name: dr
        reset_value: '''b0'
        width: '3'
      - dir: input
        name: sr1
        reset_value: '''b0'
        width: '3'
      - dir: input
