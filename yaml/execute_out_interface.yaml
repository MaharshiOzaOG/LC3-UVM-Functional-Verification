        iscompare: 'True'
        isrand: 'False'
        name: sr1
        type: bit [2:0]
      - comment: ''
        iscompare: 'True'
        isrand: 'False'
        name: sr2
        type: bit [2:0]
      - comment: ''
        iscompare: 'True'
        isrand: 'False'
        name: IR_Exec
        type: bit [15:0]
      - comment: ''
        iscompare: 'True'
        isrand: 'False'
        name: NZP
