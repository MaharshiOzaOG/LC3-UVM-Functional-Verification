uvmf:
  interfaces:
    data_mem:
      clock: clk
      reset: rst
      reset_assertion_level: 'True'
      ports:
      - dir: input
        name: complete_data
        reset_value: '''b0'
        width: '1'
      - dir: output
        name: Data_din
        reset_value: '''b0'
        width: '16'
      - dir: output
        name: Data_rd
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: Data_dout
        reset_value: '''b0'
        width: '16'      
      - dir: output
        name: Data_addr
        reset_value: '''b0'
        width: '16'      
      transaction_vars:
      - comment: ''
        iscompare: 'False'
        isrand: 'False'
        name: complete_data
        type: bit
      - comment: ''
        iscompare: 'False'
        isrand: 'False'
        name: Data_addr
        type: bit [15:0]
      - comment: ''
        iscompare: 'False'
        isrand: 'False'
        name: Data_din
        type: bit [15:0]
      - comment: ''
        iscompare: 'False'
        isrand: 'False'
        name: Data_dout
        type: bit [15:0]
      - comment: ''
        iscompare: 'False'
        isrand: 'False'
        name: Data_rd
        type: bit
