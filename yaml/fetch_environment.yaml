uvmf:
  environments:
    fetch:
      agents:
      - initiator_responder: RESPONDER
        name: agent_in
        type: fetch_in
      - initiator_responder: RESPONDER
        name: agent_out
        type: fetch_out
      analysis_components:
      - name: fetch_pred
        type: fetch_predictor
      existing_library_component: 'False'
      imports:
      - name: lc3_prediction_pkg
      scoreboards:
      - name: fetch_sb
        sb_type: uvmf_in_order_scoreboard
        trans_type: fetch_out_transaction
      tlm_connections:
      - driver: agent_in.monitored_ap
        receiver: fetch_pred.fetch_in_agent_ae
        validate: 'True'
      - driver: fetch_pred.fetch_sb_ap
        receiver: fetch_sb.expected_analysis_export
        validate: 'True'
      - driver: agent_out.monitored_ap
        receiver: fetch_sb.actual_analysis_export
        validate: 'True'
