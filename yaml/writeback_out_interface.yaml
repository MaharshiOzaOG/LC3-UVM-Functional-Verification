uvmf:
  interfaces:
    writeback_out:
      clock: clock
      ports:
      - dir: input
        name: VSR1
        reset_value: '''b0'
        width: '16'
      - dir: input
        name: VSR2
        reset_value: '''b0'
        width: '16'
      - dir: input
        name: psr
        reset_value: '''b0'
        width: '3'
      - dir: input
        name: enable_writeback
        reset_value: '''b0'
        width: '1'
      reset: reset
      reset_assertion_level: 'True'
      transaction_vars:
      - comment: ''
        iscompare: 'True'
        isrand: 'False'
        name: VSR1
        type: bit [15:0]
      - comment: ''
        iscompare: 'True'
        isrand: 'False'
        name: VSR2
        type: bit [15:0]
      - comment: ''
        iscompare: 'True'
        isrand: 'False'
        name: psr
        type: bit [2:0]
      - comment: ''
        iscompare: 'False'
        isrand: 'False'
        name: enable_writeback
        type: bit
