uvmf:
  interfaces:
    decode_in:
      clock: clock
      config_constraints: []
      config_vars: []
      ports:
      - dir: output
        name: enable_decode
        width: '1'
      - dir: output
        name: instr_dout
        width: '16'
      - dir: output
        name: npc_in
        width: '16'
      reset: reset
      reset_assertion_level: 'True'
      transaction_vars:
      - comment: ''
        iscompare: 'False'
        isrand: 'True'
        name: enable_decode
        type: bit
      - comment: ''
        iscompare: 'False'
        isrand: 'True'
        name: instr_dout
        type: bit[15:0]
      - comment: ''
        iscompare: 'False'
        isrand: 'True'
        name: npc_in
        type: bit[15:0]
