uvmf:
  interfaces:
    decode_out:
      clock: clock
      ports:
      - dir: input
        name: IR
        reset_value: '''b0'
        width: '16'
      - dir: input
        name: E_control
        reset_value: '''b0'
        width: '6'
      - dir: input
        name: npc_out
        reset_value: '''b0'
        width: '16'
      - dir: input
        name: W_control
        reset_value: '''b0'
        width: '2'
      - dir: input
        name: Mem_control
        reset_value: '''b0'
        width: '1'
      reset: reset
      reset_assertion_level: 'True'
      transaction_vars:
      - comment: ''
        iscompare: 'True'
        isrand: 'False'
        name: IR
        type: bit[15:0]
      - comment: ''
        iscompare: 'True'
        isrand: 'False'
        name: Mem_control
        type: bit
      - comment: ''
        iscompare: 'True'
        isrand: 'False'
        name: W_control
        type: bit[1:0]
      - comment: ''
        iscompare: 'True'
        isrand: 'False'
        name: E_control
        type: bit[5:0]
      - comment: ''
        iscompare: 'True'
        isrand: 'False'
        name: npc_out
        type: bit[15:0]
