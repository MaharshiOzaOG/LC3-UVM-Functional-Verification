uvmf:
  interfaces:
    control_out:
      clock: clk
      ports:
      - dir: input
        name: enable_updatePC
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: enable_fetch
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: enable_decode
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: enable_execute
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: enable_writeback
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: br_taken
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: bypass_alu_1
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: bypass_alu_2
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: bypass_mem_1
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: bypass_mem_2
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: mem_state
        reset_value: '''b0'
        width: '2'
      reset: rst
      reset_assertion_level: 'True'
      transaction_vars:
      - iscompare: 'True'
        isrand: 'False'
        name: enable_updatePC
        type: bit 
      - iscompare: 'True'
        isrand: 'False'
        name: enable_fetch
        type: bit 
      - iscompare: 'True'
        isrand: 'False'
        name: enable_decode
        type: bit 
      - iscompare: 'True'
        isrand: 'False'
        name: enable_execute
        type: bit 
      - iscompare: 'True'
        isrand: 'False'
        name: enable_writeback
        type: bit 
      - iscompare: 'True'
        isrand: 'False'
        name: br_taken
        type: bit 
      - iscompare: 'True'
        isrand: 'False'
        name: bypass_alu_1
        type: bit 
      - iscompare: 'True'
        isrand: 'False'
        name: bypass_alu_2
        type: bit 
      - iscompare: 'True'
        isrand: 'False'
        name: bypass_mem_1
        type: bit 
      - iscompare: 'True'
        isrand: 'False'
        name: bypass_mem_2
        type: bit 
      - iscompare: 'True'
        isrand: 'False'
        name: mem_state
        type: bit [1:0]
