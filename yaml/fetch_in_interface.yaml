uvmf:
  interfaces:
    fetch_in:
      clock: clk
      existing_library_component: 'False'
      ports:
      - dir: output
        name: enable_updatePC
        width: '1'
      - dir: output
        name: enable_fetch
        width: '1'
      - dir: output
        name: taddr
        width: '16'
      - dir: output
        name: br_taken
        width: '1'
      reset: rst
      reset_assertion_level: 'True'
      transaction_vars:
      - iscompare: 'False'
        isrand: 'False'
        name: enable_updatePC
        type: bit
      - iscompare: 'False'
        isrand: 'False'
        name: enable_fetch
        type: bit
      - iscompare: 'False'
        isrand: 'False'
        name: taddr
        type: bit [15:0]
      - iscompare: 'False'
        isrand: 'False'
        name: br_taken
        type: bit
