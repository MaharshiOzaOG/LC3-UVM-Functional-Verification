uvmf:
  interfaces:
    fetch_out:
      clock: clk
      existing_library_component: 'False'
      ports:
      - dir: input
        name: npc
        reset_value: '''h3001'
        width: '16'
      - dir: input
        name: pc
        reset_value: '''h3000'
        width: '16'
      - dir: input
        name: instrmem_rd
        reset_value: '''b0'
        width: '1'
      - dir: input
        name: enable_fetch
        reset_value: '''b0'
        width: '1'
      reset: rst
      reset_assertion_level: 'True'
      transaction_vars:
      - iscompare: 'True'
        isrand: 'False'
        name: npc
        type: bit [15:0]
      - iscompare: 'True'
        isrand: 'False'
        name: pc
        type: bit [15:0]
      - iscompare: 'True'
        isrand: 'False'
        name: instrmem_rd
        type: bit
